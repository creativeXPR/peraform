<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Search Console: proves ownership (Google sign-in branding). -->
    <meta name="google-site-verification" content="aLb5dJUhYp6U8_dtVX5IJls7h-moB9Dx2KXZGwYVu8w" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PeraForm</title>
    <meta name="description" content="A web app for building forms, collecting responses, and analysing results." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply a saved theme before first paint so there's no light→dark flash.
      // No saved choice = follow the system (handled in CSS).
      try {
        const theme = localStorage.getItem('peraform-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch {
        // Storage blocked (private mode etc.) — system theme still applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
