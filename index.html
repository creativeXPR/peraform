<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Connect early to the servers every page needs before it can show
         anything (reCAPTCHA → App Check → Firestore / functions), instead
         of one after another: saves seconds on slow mobile networks. -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://content-firebaseappcheck.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://europe-west1-quality-toolsx.cloudfunctions.net" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <!-- Google Search Console: proves ownership (Google sign-in branding). -->
    <meta name="google-site-verification" content="aLb5dJUhYp6U8_dtVX5IJls7h-moB9Dx2KXZGwYVu8w" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PeraForm</title>
    <meta name="description" content="A web app for building forms, collecting responses, and analysing results." />
    <meta property="og:site_name" content="PeraForm" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PeraForm" />
    <meta property="og:description" content="Build forms and onboarding-style interviews, collect responses, and analyse them — by Quality Tools." />
    <meta property="og:image" content="https://peraform-qt.web.app/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply a saved theme before first paint so there's no light→dark flash.
      // No saved choice = follow the system (handled in CSS).
      try {
        const theme = localStorage.getItem('peraform-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch {
        // Storage blocked (private mode etc.) — system theme still applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
